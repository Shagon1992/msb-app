<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MSB - Detail Lagu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f13">
<style>
  :root {
    --bg: #0f0f13; --bg-card: #16161e; --bg-input: #232330;
    --text: #e2e2e8; --accent: #4fc3f7; --chord: #4fc3f7; --lyric: #e2e2e8; 
    --border: #2a2a35; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5; padding-bottom: 90px;
  }
  
  .header-wrapper {
    position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px);
    background: rgba(15, 15, 19, 0.95); border-bottom: 1px solid var(--border);
  }
  .header-brand {
    display: flex; align-items: center; justify-content: flex-start; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .header-brand img { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--accent); object-fit: cover; }
  .header-brand h2 { font-size: 20px; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; }
  header { padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .btn-back {
    background: var(--bg-input); border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    text-decoration: none; font-size: 18px; flex-shrink: 0;
  }
  .btn-back:active { background: var(--accent); color: #000; }
  header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .paper {
    background: var(--bg-card); margin: 12px; border-radius: 12px; border: 1px solid var(--border); padding: 16px;
  }
  
  .chord-container {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 15px; color: var(--lyric); display: flex; flex-direction: column; gap: 0px; 
  }
  .line-row { 
    white-space: pre-wrap; word-wrap: break-word; line-height: 1.1; min-height: 1.2em; font-size: 1em; 
  }
  .chord-container .chord { color: var(--chord); font-weight: 700; }
  .chord-container .lyric { color: var(--lyric); }

  .bottom-actions {
    position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 15, 19, 0.95);
    backdrop-filter: blur(10px); border-top: 1px solid var(--border); 
    padding: 12px 16px; display: flex; justify-content: center; gap: 12px; z-index: 10;
  }
  .bottom-actions a, .bottom-actions button {
    padding: 10px 20px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 14px; cursor: pointer; border: none;
  }
  .btn-edit { background: var(--accent); color: #000; }
  .btn-delete { background: rgba(255,107,107,0.1); color: var(--danger); border: 1px solid var(--danger); padding: 10px 16px !important; font-size: 16px !important; }

  .sidebar {
    position: fixed; right: 0; top: 50%; transform: translateY(-50%);
    width: 60px; background: rgba(35, 35, 48, 0.95); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-right: none; border-radius: 12px 0 0 12px;
    padding: 12px 6px; display: flex; flex-direction: column; gap: 16px; z-index: 100;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -4px 0 20px rgba(0,0,0,0.5); align-items: center;
  }
  .sidebar.hidden { transform: translate(100%, -50%); }
  .toggle-sidebar {
    position: fixed; right: 60px; top: 50%; transform: translateY(-50%);
    background: var(--accent); color: #000; border: none; border-radius: 8px 0 0 8px;
    width: 24px; height: 60px; cursor: pointer; z-index: 99; display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 14px; transition: right 0.3s; box-shadow: -2px 0 10px rgba(0,0,0,0.3);
  }
  .toggle-sidebar.hidden { right: 0; }

  .side-group { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  .side-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: -4px; }
  .side-btn {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; width: 100%; padding: 8px 0; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  .side-btn:active { background: var(--accent); color: #000; }
  .transpose-val { font-size: 14px; font-weight: bold; color: var(--accent); margin: -2px 0; }

  .eq-container { display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 4px 0; }
  .eq-bar { background: #333; height: 10px; border-radius: 2px; width: 100%; cursor: pointer; transition: background 0.15s; }
  .eq-bar.active { background: #00e676; box-shadow: 0 0 8px rgba(0,230,118,0.5); }
  .eq-stop { color: var(--danger); font-weight: 900; font-size: 11px; margin-top: 4px; cursor: pointer; text-transform: lowercase; }
</style>
</head>
<body>

<div class="header-wrapper">
  <div class="header-brand">
    <img src="https://i.ibb.co.com/BKCZmKM5/MSB.jpg" alt="Logo">
    <h2>MSB (Musikan Sor Binjai)</h2>
  </div>
  <header>
    <a href="index.html" class="btn-back">←</a>
    <h1 id="header-title">Memuat...</h1>
  </header>
</div>

<div id="content" style="display:none;">
  <div class="paper">
    <div class="chord-container" id="chord-display"></div>
  </div>

  <div class="bottom-actions">
    <a href="#" id="edit-link" class="btn-edit">Edit Lagu</a>
    <button id="delete-btn" class="btn-delete" title="Hapus">🗑️</button>
  </div>
</div>

<button class="toggle-sidebar" id="toggle-sidebar">▶</button>
<div class="sidebar" id="sidebar">
  <div class="side-group">
    <div class="side-label">Trans</div>
    <button class="side-btn" id="trans-up">+</button>
    <div class="transpose-val" id="trans-val">0</div>
    <button class="side-btn" id="trans-down">-</button>
  </div>
  <div class="side-group">
    <div class="side-label">Scroll</div>
    <div class="eq-container" id="eq-container">
      <div class="eq-bar" data-speed="7"></div><div class="eq-bar" data-speed="6"></div><div class="eq-bar" data-speed="5"></div>
      <div class="eq-bar" data-speed="4"></div><div class="eq-bar" data-speed="3"></div><div class="eq-bar" data-speed="2"></div>
      <div class="eq-bar" data-speed="1"></div>
    </div>
    <div class="eq-stop" id="eq-stop">stop</div>
  </div>
  <div class="side-group">
    <div class="side-label">Font</div>
    <button class="side-btn" id="font-up">+</button>
    <button class="side-btn" id="font-down">-</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ufuqkmvuqqrazuzzjbht.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmdXFrbXZ1cXFyYXp1enpqYmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMTMxODIsImV4cCI6MjEwNzg4OTE4Mn0.V0fQ-3pmH-xrZzd9DXSYYJCofnFZxLMs519cikoF5fU';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const songId = urlParams.get('id');
  const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const CHORD_REGEX = /^\(?([A-G])([#b]?)(m|maj|min|dim|aug|sus|add|M|\+|-)?[0-9]*(?:\/([A-G])([#b]?))?\)?$/;

  let originalContent = '', currentTranspose = 0;
  let currentFontSize = 15;
  let scrollInterval = null;
  let currentSpeed = 0;

  function escapeHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function transposeChord(chord, semitones) {
    if (semitones === 0) return chord;
    const match = chord.match(/^([A-G][#b]?)(.*?)(?:\/([A-G][#b]?))?$/);
    if (!match) return chord;
    let [_, root, quality, bass] = match;
    function shiftNote(note) {
      const flatToSharp = { 'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#' };
      if (flatToSharp[note]) note = flatToSharp[note];
      let index = NOTES.indexOf(note);
      if (index === -1) return note;
      let newIndex = (index + semitones) % 12;
      if (newIndex < 0) newIndex += 12;
      return NOTES[newIndex];
    }
    return shiftNote(root) + quality + (bass ? '/' + shiftNote(bass) : '');
  }

  function renderChords(text) {
    let cleanText = text.split('\n').map(line => line.trimEnd()).join('\n');
    let lines = cleanText.split('\n');
    return lines.map(line => {
      if (!line.trim()) return `<div class="line-row">&nbsp;</div>`; 
      const tokens = line.split(/(\s+)/);
      const parsedLine = tokens.map(tok => {
        if (/^\s+$/.test(tok)) return tok; 
        let cleanTok = tok.trim();
        let isWrapped = false;
        if (cleanTok.startsWith('(') && cleanTok.endsWith(')')) {
          cleanTok = cleanTok.slice(1, -1);
          isWrapped = true;
        }
        if (cleanTok.includes('-')) {
          const parts = cleanTok.split('-');
          const processedParts = parts.map(part => {
            if (CHORD_REGEX.test(part)) {
              return `<span class="chord">${escapeHtml(transposeChord(part, currentTranspose))}</span>`;
            }
            return `<span class="lyric">${escapeHtml(part)}</span>`;
          });
          return (isWrapped ? '<span class="lyric">(</span>' : '') + processedParts.join('-') + (isWrapped ? '<span class="lyric">)</span>' : '');
        }
        if (cleanTok && CHORD_REGEX.test(cleanTok)) {
           return (isWrapped ? '<span class="lyric">(</span>' : '') + 
                  `<span class="chord">${escapeHtml(transposeChord(cleanTok, currentTranspose))}</span>` + 
                  (isWrapped ? '<span class="lyric">)</span>' : '');
        }
        return `<span class="lyric">${escapeHtml(tok)}</span>`;
      }).join('');
      return `<div class="line-row">${parsedLine}</div>`;
    }).join('');
  }

  function updateDisplay() {
    document.getElementById('trans-val').textContent = (currentTranspose > 0 ? '+' : '') + currentTranspose;
    document.getElementById('chord-display').style.fontSize = currentFontSize + 'px';
    document.getElementById('chord-display').innerHTML = renderChords(originalContent);
  }

  async function loadSong() {
    if (!songId) return;
    const { data, error } = await client.from('songs').select('*').eq('id', songId).single();
    if (error || !data) return;
    document.getElementById('header-title').textContent = data.judul_lengkap;
    document.title = data.judul_lengkap + ' - MSB';
    originalContent = data.konten_chord;
    document.getElementById('edit-link').href = 'edit.html?id=' + data.id;
    document.getElementById('content').style.display='block';
    updateDisplay();
  }

  document.getElementById('trans-up').addEventListener('click', () => { currentTranspose++; updateDisplay(); });
  document.getElementById('trans-down').addEventListener('click', () => { currentTranspose--; updateDisplay(); });
  document.getElementById('font-up').addEventListener('click', () => { if (currentFontSize < 30) { currentFontSize += 1; updateDisplay(); } });
  document.getElementById('font-down').addEventListener('click', () => { if (currentFontSize > 10) { currentFontSize -= 1; updateDisplay(); } });

  const sidebar = document.getElementById('sidebar'), toggleBtn = document.getElementById('toggle-sidebar');
  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('hidden'); toggleBtn.classList.toggle('hidden');
    toggleBtn.textContent = sidebar.classList.contains('hidden') ? '◀' : '▶';
  });

  const eqBars = document.querySelectorAll('.eq-bar');
  const stopBtn = document.getElementById('eq-stop');

  function stopScrolling() {
    if (scrollInterval) clearInterval(scrollInterval);
    scrollInterval = null; currentSpeed = 0;
    eqBars.forEach(bar => bar.classList.remove('active'));
  }

  function startScrolling(speed) {
    if (scrollInterval) clearInterval(scrollInterval);
    currentSpeed = speed;
    eqBars.forEach(bar => {
      if (parseInt(bar.dataset.speed) <= speed) bar.classList.add('active');
      else bar.classList.remove('active');
    });
    const intervalMs = 100 - (speed * 10);
    const pixels = 1 + (speed > 4 ? 1 : 0); 
    scrollInterval = setInterval(() => {
      window.scrollBy(0, pixels);
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 10) stopScrolling();
    }, intervalMs);
  }

  eqBars.forEach(bar => {
    bar.addEventListener('click', () => {
      const speed = parseInt(bar.dataset.speed);
      if (currentSpeed === speed) stopScrolling();
      else startScrolling(speed);
    });
  });
  stopBtn.addEventListener('click', stopScrolling);

  document.getElementById('delete-btn').addEventListener('click', async () => {
    if (!confirm('Hapus lagu ini?')) return;
    await client.from('songs').delete().eq('id', songId);
    window.location.href = 'index.html';
  });

  loadSong();
</script>
</body>
</html>
